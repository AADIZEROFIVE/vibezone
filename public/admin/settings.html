<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | VibeZone Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Bungee', cursive;
      background-color: #0d0d0d;
      color: #ffffff;
    }

    .admin-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #121212;
      padding: 2rem 0;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-header {
      padding: 0 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
    }

    .logo {
      width: 40px;
      margin-right: 10px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li {
      padding: 0.8rem 1.5rem;
      margin-bottom: 0.2rem;
    }

    .sidebar-menu li.active {
      background-color: rgba(155, 48, 217, 0.2);
      border-right: 3px solid #9b30d9;
    }

    .sidebar-menu a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
    }

    .sidebar-menu a:hover {
      opacity: 1;
    }

    .sidebar-menu i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .user-info {
      display: flex;
      align-items: center;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #9b30d9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }

    .settings-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .settings-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .settings-card h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #ccc;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: white;
      font-size: 1rem;
    }

    .form-control:focus {
      outline: none;
      border-color: #9b30d9;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .checkbox-group input {
      margin-right: 0.5rem;
    }

    .save-btn {
      padding: 0.8rem 2rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 207, 255, 0.3);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 30px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .4s;
      border-radius: 30px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: linear-gradient(135deg, #9b30d9, #00cfff);
    }

    input:checked + .slider:before {
      transform: translateX(30px);
    }

    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .toggle-label {
      font-size: 0.9rem;
    }

    .notification-types {
      margin-top: 1rem;
      padding-left: 1.5rem;
    }

    .color-preview {
      width: 30px;
      height: 30px;
      border-radius: 5px;
      display: inline-block;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    .color-option {
      display: flex;
      margin-bottom: 1rem;
      align-items: center;
    }

    .color-option input[type="radio"] {
      margin-right: 0.5rem;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .alert {
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      display: none;
    }

    .alert-success {
      background-color: rgba(39, 174, 96, 0.2);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.3);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../logo.png" alt="VibeZone Logo" class="logo">
        <span>Admin Panel</span>
      </div>
      <ul class="sidebar-menu">
        <li>
          <a href="dashboard.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="users.html">
            <i class="fas fa-users"></i> Users
          </a>
        </li>
        <li>
          <a href="workspaces.html">
            <i class="fas fa-briefcase"></i> Workspaces
          </a>
        </li>
        <li>
          <a href="chill-zones.html">
            <i class="fas fa-couch"></i> Chill Zones
          </a>
        </li>
        <li>
          <a href="events.html">
            <i class="fas fa-calendar-alt"></i> Events
          </a>
        </li>
        <li class="active">
          <a href="settings.html">
            <i class="fas fa-cog"></i> Settings
          </a>
        </li>
      </ul>
    </aside>

    <main>
      <div class="header">
        <div>
          <h1>Settings</h1>
        </div>
        <div class="user-info">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div>
            <div id="admin-name">Admin Name</div>
            <button id="logout-btn" class="logout-btn">Logout</button>
          </div>
        </div>
      </div>

      <div id="alert" class="alert alert-success">
        Settings saved successfully!
      </div>

      <div class="settings-container">
        <div class="settings-card">
          <h2>General Settings</h2>
          
          <div class="form-group">
            <label for="site-name">Site Name</label>
            <input type="text" id="site-name" class="form-control" value="VibeZone">
          </div>
          
          <div class="form-group">
            <label for="site-description">Site Description</label>
            <textarea id="site-description" class="form-control" rows="3">The ultimate co-working and chilling space</textarea>
          </div>
          
          <div class="toggle-container">
            <span class="toggle-label">Maintenance Mode</span>
            <label class="toggle-switch">
              <input type="checkbox" id="maintenance-mode">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-card">
          <h2>Notification Settings</h2>
          
          <div class="toggle-container">
            <span class="toggle-label">Email Notifications</span>
            <label class="toggle-switch">
              <input type="checkbox" id="email-notifications" checked>
              <span class="slider"></span>
            </label>
          </div>
          
          <div class="notification-types">
            <div class="checkbox-group">
              <input type="checkbox" id="notify-new-user" checked>
              <label for="notify-new-user">New User Registration</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="notify-new-booking" checked>
              <label for="notify-new-booking">New Booking</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="notify-event-signup" checked>
              <label for="notify-event-signup">Event Sign-up</label>
            </div>
          </div>
        </div>

        <div class="settings-card">
          <h2>Theme Settings</h2>
          
          <div class="form-group">
            <label>Theme Color</label>
            <div class="color-options">
              <div class="color-option">
                <input type="radio" name="theme-color" id="theme-purple" value="purple" checked>
                <div class="color-preview" style="background: linear-gradient(135deg, #9b30d9, #00cfff);"></div>
                <label for="theme-purple">Default (Purple/Blue)</label>
              </div>
              <div class="color-option">
                <input type="radio" name="theme-color" id="theme-green" value="green">
                <div class="color-preview" style="background: linear-gradient(135deg, #11998e, #38ef7d);"></div>
                <label for="theme-green">Green</label>
              </div>
              <div class="color-option">
                <input type="radio" name="theme-color" id="theme-orange" value="orange">
                <div class="color-preview" style="background: linear-gradient(135deg, #f12711, #f5af19);"></div>
                <label for="theme-orange">Orange</label>
              </div>
              <div class="color-option">
                <input type="radio" name="theme-color" id="theme-pink" value="pink">
                <div class="color-preview" style="background: linear-gradient(135deg, #fc466b, #3f5efb);"></div>
                <label for="theme-pink">Pink</label>
              </div>
            </div>
          </div>
          
          <div class="toggle-container">
            <span class="toggle-label">Dark Mode Only</span>
            <label class="toggle-switch">
              <input type="checkbox" id="dark-mode-only" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-card">
          <h2>Admin Account</h2>
          
          <div class="form-group">
            <label for="admin-email">Admin Email</label>
            <input type="email" id="admin-email" class="form-control" value="admin@vibezone.com">
          </div>
          
          <div class="form-group">
            <label for="admin-password">Change Password</label>
            <input type="password" id="admin-password" class="form-control" placeholder="Enter new password">
          </div>
          
          <div class="form-group">
            <label for="admin-password-confirm">Confirm Password</label>
            <input type="password" id="admin-password-confirm" class="form-control" placeholder="Confirm new password">
          </div>
        </div>

        <button id="save-settings" class="save-btn">Save Settings</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { 
      auth, 
      onAuthStateChange, 
      signOutUser 
    } from '../js/auth.js';
    
    import { 
      initAdminPage
    } from '../js/admin.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      // Verify admin status
      const isAdmin = await initAdminPage();
      if (!isAdmin) return;

      // Update admin name
      if (auth.currentUser) {
        document.getElementById('admin-name').textContent = auth.currentUser.displayName;
        document.getElementById('admin-email').value = auth.currentUser.email;
      }

      // Handle logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        try {
          await signOutUser();
          window.location.href = '../login.html';
        } catch (error) {
          console.error("Logout error:", error);
        }
      });

      // Handle save settings
      document.getElementById('save-settings').addEventListener('click', function() {
        // Validate password fields
        const password = document.getElementById('admin-password').value;
        const confirmPassword = document.getElementById('admin-password-confirm').value;
        
        if (password && password !== confirmPassword) {
          alert('Passwords do not match!');
          return;
        }
        
        // In a real app, would save settings to database here
        // For demo, just show success message
        const alert = document.getElementById('alert');
        alert.style.display = 'block';
        
        // Hide alert after 3 seconds
        setTimeout(() => {
          alert.style.display = 'none';
        }, 3000);
        
        // Clear password fields
        document.getElementById('admin-password').value = '';
        document.getElementById('admin-password-confirm').value = '';
      });
    });
  </script>
</body>
</html>
