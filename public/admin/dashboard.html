<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | VibeZone</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Bungee', cursive;
      background-color: #0d0d0d;
      color: #ffffff;
    }

    .admin-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #121212;
      padding: 2rem 0;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-header {
      padding: 0 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
    }

    .logo {
      width: 40px;
      margin-right: 10px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li {
      padding: 0.8rem 1.5rem;
      margin-bottom: 0.2rem;
    }

    .sidebar-menu li.active {
      background-color: rgba(155, 48, 217, 0.2);
      border-right: 3px solid #9b30d9;
    }

    .sidebar-menu a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
    }

    .sidebar-menu a:hover {
      opacity: 1;
    }

    .sidebar-menu i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .user-info {
      display: flex;
      align-items: center;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #9b30d9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .stat-card h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1rem;
      opacity: 0.8;
    }

    .stat-card .number {
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .recent-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .recent-section h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="logo.png" alt="VibeZone Logo" class="logo">
        <span>Admin Panel</span>
      </div>
      <ul class="sidebar-menu">
        <li class="active">
          <a href="/admin/dashboard.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="/admin/users.html">
            <i class="fas fa-users"></i> Users
          </a>
        </li>
        <li>
          <a href="/admin/workspaces.html">
            <i class="fas fa-briefcase"></i> Workspaces
          </a>
        </li>
        <li>
          <a href="/admin/chill-zones.html">
            <i class="fas fa-couch"></i> Chill Zones
          </a>
        </li>
        <li>
          <a href="/admin/events.html">
            <i class="fas fa-calendar-alt"></i> Events
          </a>
        </li>
        <li>
          <a href="/admin/settings.html">
            <i class="fas fa-cog"></i> Settings
          </a>
        </li>
      </ul>
    </aside>

    <main>
      <div class="header">
        <h1>Dashboard</h1>
        <div class="user-info">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div>
            <div id="admin-name">Admin Name</div>
            <button id="logout-btn" class="logout-btn">Logout</button>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Users</h3>
          <div id="total-users" class="number">0</div>
        </div>
        <div class="stat-card">
          <h3>Workspaces</h3>
          <div id="total-workspaces" class="number">0</div>
        </div>
        <div class="stat-card">
          <h3>Chill Zones</h3>
          <div id="total-chill-zones" class="number">0</div>
        </div>
        <div class="stat-card">
          <h3>Events</h3>
          <div id="total-events" class="number">0</div>
        </div>
      </div>

      <div class="recent-section">
        <h2>Recent Users</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Mobile</th>
              <th>Joined</th>
            </tr>
          </thead>
          <tbody id="recent-users-table">
            <!-- Will be populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <div class="recent-section">
        <h2>Recent Events</h2>
        <table>
          <thead>
            <tr>
              <th>Event Name</th>
              <th>Date</th>
              <th>Location</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="recent-events-table">
            <!-- Will be populated by JavaScript -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { auth, onAuthStateChange, signOutUser } from '../js/auth.js';
    import { initAdminPage, getDashboardStats, getAllUsers } from '../js/admin.js';
    import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { db } from '../js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // Verify admin status
      const isAdmin = await initAdminPage();
      if (!isAdmin) return;

      // Update admin name
      document.getElementById('admin-name').textContent = auth.currentUser.displayName;

      // Handle logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await signOutUser();
        window.location.href = '/login.html';
      });

      // Load dashboard stats
      try {
        const stats = await getDashboardStats();
        document.getElementById('total-users').textContent = stats.totalUsers;
        document.getElementById('total-workspaces').textContent = stats.totalWorkspaces;
        document.getElementById('total-chill-zones').textContent = stats.totalChillZones;
        document.getElementById('total-events').textContent = stats.totalEvents;

        // Load recent users
        const usersQuery = query(collection(db, "users"), orderBy("createdAt", "desc"), limit(5));
        const usersSnapshot = await getDocs(usersQuery);
        
        const usersTable = document.getElementById('recent-users-table');
        usersTable.innerHTML = '';
        
        usersSnapshot.forEach(doc => {
          const userData = doc.data();
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${userData.name || 'N/A'}</td>
            <td>${userData.email || 'N/A'}</td>
            <td>${userData.mobile || 'N/A'}</td>
            <td>${userData.createdAt ? new Date(userData.createdAt.toDate()).toLocaleDateString() : 'N/A'}</td>
          `;
          usersTable.appendChild(row);
        });

        // Load recent events
        const eventsQuery = query(collection(db, "events"), orderBy("createdAt", "desc"), limit(5));
        const eventsSnapshot = await getDocs(eventsQuery);
        
        const eventsTable = document.getElementById('recent-events-table');
        eventsTable.innerHTML = '';
        
        eventsSnapshot.forEach(doc => {
          const eventData = doc.data();
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${eventData.name || 'N/A'}</td>
            <td>${eventData.date ? new Date(eventData.date.toDate()).toLocaleDateString() : 'N/A'}</td>
            <td>${eventData.location || 'N/A'}</td>
            <td>${eventData.status || 'Active'}</td>
          `;
          eventsTable.appendChild(row);
        });
      } catch (error) {
        console.error("Error loading dashboard data:", error);
      }
    });
  </script>
</body>
</html>
