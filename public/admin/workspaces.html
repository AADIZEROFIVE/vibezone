<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Workspaces | VibeZone Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Bungee', cursive;
      background-color: #0d0d0d;
      color: #ffffff;
    }

    .admin-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #121212;
      padding: 2rem 0;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-header {
      padding: 0 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
    }

    .logo {
      width: 40px;
      margin-right: 10px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li {
      padding: 0.8rem 1.5rem;
      margin-bottom: 0.2rem;
    }

    .sidebar-menu li.active {
      background-color: rgba(155, 48, 217, 0.2);
      border-right: 3px solid #9b30d9;
    }

    .sidebar-menu a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
    }

    .sidebar-menu a:hover {
      opacity: 1;
    }

    .sidebar-menu i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .user-info {
      display: flex;
      align-items: center;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #9b30d9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }

    .add-btn {
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }

    .add-btn i {
      margin-right: 0.5rem;
    }

    .add-btn:hover {
      transform: translateY(-2px);
    }

    .workspaces-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .workspace-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .workspace-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .workspace-image {
      height: 160px;
      background: linear-gradient(135deg, #440080, #00cfff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
    }

    .workspace-content {
      padding: 1.5rem;
    }

    .workspace-title {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .workspace-location {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      color: #ccc;
      margin-bottom: 0.5rem;
    }

    .workspace-location i {
      margin-right: 0.5rem;
      font-size: 0.8rem;
    }

    .workspace-price {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #00cfff;
    }

    .workspace-amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .amenity-tag {
      background: rgba(155, 48, 217, 0.2);
      color: #ccc;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    .workspace-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
    }

    .workspace-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .edit-btn {
      background: rgba(0, 207, 255, 0.2);
      color: #00cfff;
      border: 1px solid #00cfff;
    }

    .edit-btn:hover {
      background: rgba(0, 207, 255, 0.3);
    }

    .delete-btn {
      background: rgba(255, 82, 82, 0.2);
      color: #ff5252;
      border: 1px solid #ff5252;
    }

    .delete-btn:hover {
      background: rgba(255, 82, 82, 0.3);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      overflow: auto;
    }

    .modal-content {
      background-color: #1a1a1a;
      margin: 5% auto;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .modal-header {
      padding: 1.5rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      margin: 0;
      color: white;
    }

    .close-btn {
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #ccc;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: white;
      font-size: 0.9rem;
    }

    .form-control:focus {
      outline: none;
      border-color: #9b30d9;
    }

    .form-check {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .form-check input {
      margin-right: 0.5rem;
    }

    .amenities-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../logo.png" alt="VibeZone Logo" class="logo">
        <span>Admin Panel</span>
      </div>
      <ul class="sidebar-menu">
        <li>
          <a href="dashboard.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="users.html">
            <i class="fas fa-users"></i> Users
          </a>
        </li>
        <li class="active">
          <a href="workspaces.html">
            <i class="fas fa-briefcase"></i> Workspaces
          </a>
        </li>
        <li>
          <a href="chill-zones.html">
            <i class="fas fa-couch"></i> Chill Zones
          </a>
        </li>
        <li>
          <a href="events.html">
            <i class="fas fa-calendar-alt"></i> Events
          </a>
        </li>
        <li>
          <a href="settings.html">
            <i class="fas fa-cog"></i> Settings
          </a>
        </li>
      </ul>
    </aside>

    <main>
      <div class="header">
        <div>
          <h1>Manage Workspaces</h1>
        </div>
        <div class="user-info">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div>
            <div id="admin-name">Admin Name</div>
            <button id="logout-btn" class="logout-btn">Logout</button>
          </div>
        </div>
      </div>

      <button id="add-workspace-btn" class="add-btn">
        <i class="fas fa-plus"></i> Add New Workspace
      </button>

      <div class="workspaces-grid" id="workspaces-container">
        <!-- Will be populated by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Add/Edit Workspace Modal -->
  <div id="workspace-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Add New Workspace</h2>
        <span class="close-btn">&times;</span>
      </div>
      <div class="modal-body">
        <form id="workspace-form">
          <input type="hidden" id="workspace-id">
          <div class="form-group">
            <label for="workspace-name">Name</label>
            <input type="text" id="workspace-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="workspace-description">Description</label>
            <textarea id="workspace-description" class="form-control" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label for="workspace-location">Location</label>
            <input type="text" id="workspace-location" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="workspace-capacity">Capacity</label>
            <input type="number" id="workspace-capacity" class="form-control" min="1" required>
          </div>
          <div class="form-group">
            <label for="workspace-price">Price per hour ($)</label>
            <input type="number" id="workspace-price" class="form-control" min="0" step="0.01" required>
          </div>
          <div class="form-group">
            <label>Amenities</label>
            <div class="amenities-container">
              <div class="form-check">
                <input type="checkbox" id="amenity-wifi" class="amenity-checkbox" value="WiFi">
                <label for="amenity-wifi">WiFi</label>
              </div>
              <div class="form-check">
                <input type="checkbox" id="amenity-projector" class="amenity-checkbox" value="Projector">
                <label for="amenity-projector">Projector</label>
              </div>
              <div class="form-check">
                <input type="checkbox" id="amenity-whiteboard" class="amenity-checkbox" value="Whiteboard">
                <label for="amenity-whiteboard">Whiteboard</label>
              </div>
              <div class="form-check">
                <input type="checkbox" id="amenity-coffee" class="amenity-checkbox" value="Coffee">
                <label for="amenity-coffee">Coffee</label>
              </div>
              <div class="form-check">
                <input type="checkbox" id="amenity-printer" class="amenity-checkbox" value="Printer">
                <label for="amenity-printer">Printer</label>
              </div>
              <div class="form-check">
                <input type="checkbox" id="amenity-ac" class="amenity-checkbox" value="Air Conditioning">
                <label for="amenity-ac">Air Conditioning</label>
              </div>
            </div>
          </div>
          <button type="submit" class="submit-btn" id="workspace-submit-btn">Save Workspace</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { 
      auth, 
      onAuthStateChange, 
      signOutUser 
    } from '../js/auth.js';
    
    import { 
      initAdminPage, 
      getWorkspaces, 
      addWorkspace, 
      updateWorkspace, 
      deleteWorkspace 
    } from '../js/admin.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      // Verify admin status
      const isAdmin = await initAdminPage();
      if (!isAdmin) return;

      // Update admin name
      if (auth.currentUser) {
        document.getElementById('admin-name').textContent = auth.currentUser.displayName;
      }

      // Handle logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        try {
          await signOutUser();
          window.location.href = '../login.html';
        } catch (error) {
          console.error("Logout error:", error);
        }
      });

      // Load workspaces
      try {
        const workspaces = await getWorkspaces();
        displayWorkspaces(workspaces);
      } catch (error) {
        console.error("Error loading workspaces:", error);
        alert("Error loading workspaces. Please try again.");
      }

      // Modal elements
      const modal = document.getElementById('workspace-modal');
      const closeBtn = document.querySelector('.close-btn');
      const addWorkspaceBtn = document.getElementById('add-workspace-btn');
      const workspaceForm = document.getElementById('workspace-form');
      const modalTitle = document.getElementById('modal-title');
      const workspaceSubmitBtn = document.getElementById('workspace-submit-btn');

      // Show modal when add button is clicked
      addWorkspaceBtn.addEventListener('click', () => {
        modalTitle.textContent = 'Add New Workspace';
        workspaceSubmitBtn.textContent = 'Add Workspace';
        resetForm();
        modal.style.display = 'block';
      });

      // Close modal when close button is clicked
      closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
      });

      // Close modal when clicking outside
      window.addEventListener('click', (event) => {
        if (event.target === modal) {
          modal.style.display = 'none';
        }
      });

      // Handle form submission
      workspaceForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const workspaceId = document.getElementById('workspace-id').value;
        const name = document.getElementById('workspace-name').value;
        const description = document.getElementById('workspace-description').value;
        const location = document.getElementById('workspace-location').value;
        const capacity = parseInt(document.getElementById('workspace-capacity').value);
        const price = parseFloat(document.getElementById('workspace-price').value);
        
        // Get selected amenities
        const amenities = [];
        document.querySelectorAll('.amenity-checkbox:checked').forEach(checkbox => {
          amenities.push(checkbox.value);
        });
        
        const workspaceData = {
          name,
          description,
          location,
          capacity,
          price,
          amenities
        };
        
        try {
          if (workspaceId) {
            // Update existing workspace
            await updateWorkspace(workspaceId, workspaceData);
            alert('Workspace updated successfully!');
          } else {
            // Add new workspace
            await addWorkspace(workspaceData);
            alert('Workspace added successfully!');
          }
          
          // Refresh workspaces and close modal
          const workspaces = await getWorkspaces();
          displayWorkspaces(workspaces);
          modal.style.display = 'none';
        } catch (error) {
          console.error("Error saving workspace:", error);
          alert('Error saving workspace: ' + error.message);
        }
      });

      // Function to reset form
      function resetForm() {
        document.getElementById('workspace-id').value = '';
        document.getElementById('workspace-name').value = '';
        document.getElementById('workspace-description').value = '';
        document.getElementById('workspace-location').value = '';
        document.getElementById('workspace-capacity').value = '';
        document.getElementById('workspace-price').value = '';
        
        // Uncheck all amenities
        document.querySelectorAll('.amenity-checkbox').forEach(checkbox => {
          checkbox.checked = false;
        });
      }

      // Function to display workspaces
      function displayWorkspaces(workspaces) {
        const container = document.getElementById('workspaces-container');
        container.innerHTML = '';
        
        if (workspaces.length === 0) {
          container.innerHTML = '<p>No workspaces found. Click "Add New Workspace" to create one.</p>';
          return;
        }
        
        workspaces.forEach(workspace => {
          const workspaceCard = document.createElement('div');
          workspaceCard.className = 'workspace-card';
          
          // Generate amenities HTML
          let amenitiesHtml = '';
          if (workspace.amenities && workspace.amenities.length > 0) {
            workspace.amenities.forEach(amenity => {
              amenitiesHtml += `<span class="amenity-tag">${amenity}</span>`;
            });
          }
          
          workspaceCard.innerHTML = `
            <div class="workspace-image">
              <i class="fas fa-briefcase"></i>
            </div>
            <div class="workspace-content">
              <h3 class="workspace-title">${workspace.name}</h3>
              <div class="workspace-location">
                <i class="fas fa-map-marker-alt"></i> ${workspace.location}
              </div>
              <div class="workspace-price">${workspace.price}/hour</div>
              <p>${workspace.description}</p>
              <div class="workspace-amenities">
                ${amenitiesHtml}
              </div>
              <div class="workspace-actions">
                <button class="workspace-btn edit-btn" data-id="${workspace.id}">
                  <i class="fas fa-edit"></i> Edit
                </button>
                <button class="workspace-btn delete-btn" data-id="${workspace.id}">
                  <i class="fas fa-trash-alt"></i> Delete
                </button>
              </div>
            </div>
          `;
          
          container.appendChild(workspaceCard);
          
          // Add edit button event listener
          workspaceCard.querySelector('.edit-btn').addEventListener('click', () => {
            modalTitle.textContent = 'Edit Workspace';
            workspaceSubmitBtn.textContent = 'Update Workspace';
            
            // Fill form with workspace data
            document.getElementById('workspace-id').value = workspace.id;
            document.getElementById('workspace-name').value = workspace.name;
            document.getElementById('workspace-description').value = workspace.description;
            document.getElementById('workspace-location').value = workspace.location;
            document.getElementById('workspace-capacity').value = workspace.capacity;
            document.getElementById('workspace-price').value = workspace.price;
            
            // Check appropriate amenities
            document.querySelectorAll('.amenity-checkbox').forEach(checkbox => {
              checkbox.checked = workspace.amenities && workspace.amenities.includes(checkbox.value);
            });
            
            modal.style.display = 'block';
          });
          
          // Add delete button event listener
          workspaceCard.querySelector('.delete-btn').addEventListener('click', async () => {
            if (confirm('Are you sure you want to delete this workspace?')) {
              try {
                await deleteWorkspace(workspace.id);
                alert('Workspace deleted successfully!');
                
                // Refresh workspaces
                const workspaces = await getWorkspaces();
                displayWorkspaces(workspaces);
              } catch (error) {
                console.error("Error deleting workspace:", error);
                alert('Error deleting workspace: ' + error.message);
              }
            }
          });
        });
      }
    });
  </script>
</body>
</html>
