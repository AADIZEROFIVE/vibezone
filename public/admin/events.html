<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Events | VibeZone Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Bungee', cursive;
      background-color: #0d0d0d;
      color: #ffffff;
    }

    .admin-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #121212;
      padding: 2rem 0;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-header {
      padding: 0 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
    }

    .logo {
      width: 40px;
      margin-right: 10px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li {
      padding: 0.8rem 1.5rem;
      margin-bottom: 0.2rem;
    }

    .sidebar-menu li.active {
      background-color: rgba(155, 48, 217, 0.2);
      border-right: 3px solid #9b30d9;
    }

    .sidebar-menu a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
    }

    .sidebar-menu a:hover {
      opacity: 1;
    }

    .sidebar-menu i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .user-info {
      display: flex;
      align-items: center;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #9b30d9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }

    .add-btn {
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }

    .add-btn i {
      margin-right: 0.5rem;
    }

    .add-btn:hover {
      transform: translateY(-2px);
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .event-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .event-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .event-image {
      height: 160px;
      background: linear-gradient(135deg, #440080, #00cfff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
    }

    .event-content {
      padding: 1.5rem;
    }

    .event-title {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .event-date {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      color: #00cfff;
      margin-bottom: 0.5rem;
    }

    .event-date i {
      margin-right: 0.5rem;
      font-size: 0.8rem;
    }

    .event-location {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      color: #ccc;
      margin-bottom: 0.5rem;
    }

    .event-location i {
      margin-right: 0.5rem;
      font-size: 0.8rem;
    }

    .event-price {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #00cfff;
    }

    .event-category {
      display: inline-block;
      background: rgba(155, 48, 217, 0.2);
      color: #ccc;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    .event-status {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    .status-active {
      background-color: rgba(39, 174, 96, 0.2);
      color: #27ae60;
    }

    .status-upcoming {
      background-color: rgba(52, 152, 219, 0.2);
      color: #3498db;
    }

    .status-cancelled {
      background-color: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
    }

    .event-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
    }

    .event-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .edit-btn {
      background: rgba(0, 207, 255, 0.2);
      color: #00cfff;
      border: 1px solid #00cfff;
    }

    .edit-btn:hover {
      background: rgba(0, 207, 255, 0.3);
    }

    .delete-btn {
      background: rgba(255, 82, 82, 0.2);
      color: #ff5252;
      border: 1px solid #ff5252;
    }

    .delete-btn:hover {
      background: rgba(255, 82, 82, 0.3);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      overflow: auto;
    }

    .modal-content {
      background-color: #1a1a1a;
      margin: 5% auto;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .modal-header {
      padding: 1.5rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      margin: 0;
      color: white;
    }

    .close-btn {
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #ccc;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: white;
      font-size: 0.9rem;
    }

    .form-control:focus {
      outline: none;
      border-color: #9b30d9;
    }

    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../logo.png" alt="VibeZone Logo" class="logo">
        <span>Admin Panel</span>
      </div>
      <ul class="sidebar-menu">
        <li>
          <a href="dashboard.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="users.html">
            <i class="fas fa-users"></i> Users
          </a>
        </li>
        <li>
          <a href="workspaces.html">
            <i class="fas fa-briefcase"></i> Workspaces
          </a>
        </li>
        <li>
          <a href="chill-zones.html">
            <i class="fas fa-couch"></i> Chill Zones
          </a>
        </li>
        <li class="active">
          <a href="events.html">
            <i class="fas fa-calendar-alt"></i> Events
          </a>
        </li>
        <li>
          <a href="settings.html">
            <i class="fas fa-cog"></i> Settings
          </a>
        </li>
      </ul>
    </aside>

    <main>
      <div class="header">
        <div>
          <h1>Manage Events</h1>
        </div>
        <div class="user-info">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div>
            <div id="admin-name">Admin Name</div>
            <button id="logout-btn" class="logout-btn">Logout</button>
          </div>
        </div>
      </div>

      <button id="add-event-btn" class="add-btn">
        <i class="fas fa-plus"></i> Add New Event
      </button>

      <div class="events-grid" id="events-container">
        <!-- Will be populated by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Add/Edit Event Modal -->
  <div id="event-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Add New Event</h2>
        <span class="close-btn">&times;</span>
      </div>
      <div class="modal-body">
        <form id="event-form">
          <input type="hidden" id="event-id">
          <div class="form-group">
            <label for="event-name">Event Name</label>
            <input type="text" id="event-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="event-description">Description</label>
            <textarea id="event-description" class="form-control" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label for="event-date">Date & Time</label>
            <input type="datetime-local" id="event-date" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="event-location">Location</label>
            <input type="text" id="event-location" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="event-capacity">Capacity</label>
            <input type="number" id="event-capacity" class="form-control" min="1" required>
          </div>
          <div class="form-group">
            <label for="event-price">Price ($)</label>
            <input type="number" id="event-price" class="form-control" min="0" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="event-category">Category</label>
            <select id="event-category" class="form-control" required>
              <option value="">Select a category</option>
              <option value="Workshop">Workshop</option>
              <option value="Networking">Networking</option>
              <option value="Music">Music</option>
              <option value="Tech">Tech</option>
              <option value="Art">Art</option>
              <option value="Wellness">Wellness</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="event-status">Status</label>
            <select id="event-status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Upcoming">Upcoming</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <button type="submit" class="submit-btn" id="event-submit-btn">Save Event</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { 
      auth, 
      onAuthStateChange, 
      signOutUser 
    } from '../js/auth.js';
    
    import { 
      initAdminPage, 
      getEvents, 
      addEvent, 
      updateEvent, 
      deleteEvent 
    } from '../js/admin.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      // Verify admin status
      const isAdmin = await initAdminPage();
      if (!isAdmin) return;

      // Update admin name
      if (auth.currentUser) {
        document.getElementById('admin-name').textContent = auth.currentUser.displayName;
      }

      // Handle logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        try {
          await signOutUser();
          window.location.href = '../login.html';
        } catch (error) {
          console.error("Logout error:", error);
        }
      });

      // Load events
      try {
        const events = await getEvents();
        displayEvents(events);
      } catch (error) {
        console.error("Error loading events:", error);
        alert("Error loading events. Please try again.");
      }

      // Modal elements
      const modal = document.getElementById('event-modal');
      const closeBtn = document.querySelector('.close-btn');
      const addEventBtn = document.getElementById('add-event-btn');
      const eventForm = document.getElementById('event-form');
      const modalTitle = document.getElementById('modal-title');
      const eventSubmitBtn = document.getElementById('event-submit-btn');

      // Show modal when add button is clicked
      addEventBtn.addEventListener('click', () => {
        modalTitle.textContent = 'Add New Event';
        eventSubmitBtn.textContent = 'Add Event';
        resetForm();
        modal.style.display = 'block';
      });

      // Close modal when close button is clicked
      closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
      });

      // Close modal when clicking outside
      window.addEventListener('click', (event) => {
        if (event.target === modal) {
          modal.style.display = 'none';
        }
      });

      // Handle form submission
      eventForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const eventId = document.getElementById('event-id').value;
        const name = document.getElementById('event-name').value;
        const description = document.getElementById('event-description').value;
        const dateValue = document.getElementById('event-date').value;
        const date = new Date(dateValue);
        const location = document.getElementById('event-location').value;
        const capacity = parseInt(document.getElementById('event-capacity').value);
        const price = parseFloat(document.getElementById('event-price').value);
        const category = document.getElementById('event-category').value;
        const status = document.getElementById('event-status').value;
        
        const eventData = {
          name,
          description,
          date,
          location,
          capacity,
          price,
          category,
          status
        };
        
        try {
          if (eventId) {
            // Update existing event
            await updateEvent(eventId, eventData);
            alert('Event updated successfully!');
          } else {
            // Add new event
            await addEvent(eventData);
            alert('Event added successfully!');
          }
          
          // Refresh events and close modal
          const events = await getEvents();
          displayEvents(events);
          modal.style.display = 'none';
        } catch (error) {
          console.error("Error saving event:", error);
          alert('Error saving event: ' + error.message);
        }
      });

      // Function to reset form
      function resetForm() {
        document.getElementById('event-id').value = '';
        document.getElementById('event-name').value = '';
        document.getElementById('event-description').value = '';
        document.getElementById('event-date').value = '';
        document.getElementById('event-location').value = '';
        document.getElementById('event-capacity').value = '';
        document.getElementById('event-price').value = '';
        document.getElementById('event-category').value = '';
        document.getElementById('event-status').value = 'Active';
      }

      // Function to format date
      function formatDate(timestamp) {
        if (!timestamp) return 'N/A';
        const date = new Date(timestamp.toDate());
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      // Function to display events
      function displayEvents(events) {
        const container = document.getElementById('events-container');
        container.innerHTML = '';
        
        if (events.length === 0) {
          container.innerHTML = '<p>No events found. Click "Add New Event" to create one.</p>';
          return;
        }
        
        events.forEach(event => {
          const eventCard = document.createElement('div');
          eventCard.className = 'event-card';
          
          // Determine status class
          let statusClass = '';
          switch (event.status) {
            case 'Active':
              statusClass = 'status-active';
              break;
            case 'Upcoming':
              statusClass = 'status-upcoming';
              break;
            case 'Cancelled':
              statusClass = 'status-cancelled';
              break;
            default:
              statusClass = 'status-active';
          }
          
          // Determine emoji based on category
          let categoryEmoji = '';
          switch (event.category) {
            case 'Workshop':
              categoryEmoji = '🔧';
              break;
            case 'Networking':
              categoryEmoji = '👥';
              break;
            case 'Music':
              categoryEmoji = '🎵';
              break;
            case 'Tech':
              categoryEmoji = '💻';
              break;
            case 'Art':
              categoryEmoji = '🎨';
              break;
            case 'Wellness':
              categoryEmoji = '🧘';
              break;
            default:
              categoryEmoji = '🎉';
          }
          
          eventCard.innerHTML = `
            <div class="event-image">
              ${categoryEmoji}
            </div>
            <div class="event-content">
              <h3 class="event-title">${event.name}</h3>
              <div class="event-date">
                <i class="far fa-calendar"></i> ${formatDate(event.date)}
              </div>
              <div class="event-location">
                <i class="fas fa-map-marker-alt"></i> ${event.location}
              </div>
              <div class="event-price">${event.price > 0 ? ' + event.price : 'Free'}</div>
              <div>
                <span class="event-category">${event.category}</span>
                <span class="event-status ${statusClass}">${event.status}</span>
              </div>
              <p>${event.description}</p>
              <div class="event-actions">
                <button class="event-btn edit-btn" data-id="${event.id}">
                  <i class="fas fa-edit"></i> Edit
                </button>
                <button class="event-btn delete-btn" data-id="${event.id}">
                  <i class="fas fa-trash-alt"></i> Delete
                </button>
              </div>
            </div>
          `;
          
          container.appendChild(eventCard);
          
          // Add edit button event listener
          eventCard.querySelector('.edit-btn').addEventListener('click', () => {
            modalTitle.textContent = 'Edit Event';
            eventSubmitBtn.textContent = 'Update Event';
            
            // Fill form with event data
            document.getElementById('event-id').value = event.id;
            document.getElementById('event-name').value = event.name;
            document.getElementById('event-description').value = event.description;
            
            // Format date for datetime-local input
            if (event.date) {
              const date = new Date(event.date.toDate());
              const formattedDate = date.toISOString().slice(0, 16);
              document.getElementById('event-date').value = formattedDate;
            }
            
            document.getElementById('event-location').value = event.location;
            document.getElementById('event-capacity').value = event.capacity;
            document.getElementById('event-price').value = event.price;
            document.getElementById('event-category').value = event.category;
            document.getElementById('event-status').value = event.status;
            
            modal.style.display = 'block';
          });
          
          // Add delete button event listener
          eventCard.querySelector('.delete-btn').addEventListener('click', async () => {
            if (confirm('Are you sure you want to delete this event?')) {
              try {
                await deleteEvent(event.id);
                alert('Event deleted successfully!');
                
                // Refresh events
                const events = await getEvents();
                displayEvents(events);
              } catch (error) {
                console.error("Error deleting event:", error);
                alert('Error deleting event: ' + error.message);
              }
            }
          });
        });
      }
    });
  </script>
</body>
</html>
