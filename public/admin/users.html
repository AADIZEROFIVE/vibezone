<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users | VibeZone Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Bungee', cursive;
      background-color: #0d0d0d;
      color: #ffffff;
    }

    .admin-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #121212;
      padding: 2rem 0;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-header {
      padding: 0 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
    }

    .logo {
      width: 40px;
      margin-right: 10px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li {
      padding: 0.8rem 1.5rem;
      margin-bottom: 0.2rem;
    }

    .sidebar-menu li.active {
      background-color: rgba(155, 48, 217, 0.2);
      border-right: 3px solid #9b30d9;
    }

    .sidebar-menu a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
    }

    .sidebar-menu a:hover {
      opacity: 1;
    }

    .sidebar-menu i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .user-info {
      display: flex;
      align-items: center;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #9b30d9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }

    .users-table-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: normal;
    }

    .status-admin {
      background-color: rgba(155, 48, 217, 0.2);
      color: #9b30d9;
    }

    .status-user {
      background-color: rgba(0, 207, 255, 0.2);
      color: #00cfff;
    }

    .action-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.8rem;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .admin-btn {
      border-color: #9b30d9;
    }

    .admin-btn:hover {
      background: rgba(155, 48, 217, 0.2);
    }

    .remove-btn {
      border-color: #ff5252;
    }

    .remove-btn:hover {
      background: rgba(255, 82, 82, 0.2);
    }

    .search-box {
      display: flex;
      margin-bottom: 1.5rem;
    }

    .search-input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px 0 0 4px;
      color: white;
      font-size: 1rem;
    }

    .search-btn {
      padding: 0.75rem 1rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      color: white;
      border: none;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }

    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .pagination-btn {
      margin: 0 0.25rem;
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .pagination-btn.active {
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      border-color: transparent;
    }

    .pagination-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.2);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../logo.png" alt="VibeZone Logo" class="logo">
        <span>Admin Panel</span>
      </div>
      <ul class="sidebar-menu">
        <li>
          <a href="dashboard.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
        </li>
        <li class="active">
          <a href="users.html">
            <i class="fas fa-users"></i> Users
          </a>
        </li>
        <li>
          <a href="workspaces.html">
            <i class="fas fa-briefcase"></i> Workspaces
          </a>
        </li>
        <li>
          <a href="chill-zones.html">
            <i class="fas fa-couch"></i> Chill Zones
          </a>
        </li>
        <li>
          <a href="events.html">
            <i class="fas fa-calendar-alt"></i> Events
          </a>
        </li>
        <li>
          <a href="settings.html">
            <i class="fas fa-cog"></i> Settings
          </a>
        </li>
      </ul>
    </aside>

    <main>
      <div class="header">
        <h1>Manage Users</h1>
        <div class="user-info">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div>
            <div id="admin-name">Admin Name</div>
            <button id="logout-btn" class="logout-btn">Logout</button>
          </div>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="search-users" class="search-input" placeholder="Search users...">
        <button class="search-btn">
          <i class="fas fa-search"></i>
        </button>
      </div>

      <div class="users-table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Mobile</th>
              <th>Joined</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-table">
            <!-- Will be populated by JavaScript -->
          </tbody>
        </table>
        
        <div class="pagination" id="pagination">
          <!-- Will be populated by JavaScript -->
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { 
      auth, 
      onAuthStateChange, 
      signOutUser 
    } from '../js/auth.js';
    
    import { 
      initAdminPage, 
      getAllUsers, 
      toggleAdminStatus,
      deleteUser 
    } from '../js/admin.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      // Verify admin status
      const isAdmin = await initAdminPage();
      if (!isAdmin) return;

      // Update admin name
      if (auth.currentUser) {
        document.getElementById('admin-name').textContent = auth.currentUser.displayName;
      }

      // Handle logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        try {
          await signOutUser();
          window.location.href = '../login.html';
        } catch (error) {
          console.error("Logout error:", error);
        }
      });

      // Load users
      try {
        const users = await getAllUsers();
        displayUsers(users);
      } catch (error) {
        console.error("Error loading users:", error);
        alert("Error loading users. Please try again.");
      }

      // Search functionality
      const searchInput = document.getElementById('search-users');
      searchInput.addEventListener('input', async () => {
        const query = searchInput.value.toLowerCase();
        const users = await getAllUsers();
        const filteredUsers = users.filter(user => 
          user.name?.toLowerCase().includes(query) || 
          user.email?.toLowerCase().includes(query) ||
          user.mobile?.includes(query)
        );
        displayUsers(filteredUsers);
      });
    });

    function displayUsers(users) {
      const usersTable = document.getElementById('users-table');
      usersTable.innerHTML = '';
      
      users.forEach(user => {
        const row = document.createElement('tr');
        
        const adminBadge = user.isAdmin 
          ? '<span class="status-badge status-admin">Admin</span>' 
          : '<span class="status-badge status-user">User</span>';
        
        const adminAction = user.isAdmin
          ? `<button class="action-btn" data-id="${user.id}" data-action="remove-admin">Remove Admin</button>`
          : `<button class="action-btn admin-btn" data-id="${user.id}" data-action="make-admin">Make Admin</button>`;
        
        const createdDate = user.createdAt ? new Date(user.createdAt.toDate()).toLocaleDateString() : 'N/A';
        
        row.innerHTML = `
          <td>${user.name || 'N/A'}</td>
          <td>${user.email || 'N/A'}</td>
          <td>${user.mobile || 'N/A'}</td>
          <td>${createdDate}</td>
          <td>${adminBadge}</td>
          <td>
            ${adminAction}
            <button class="action-btn remove-btn" data-id="${user.id}" data-action="delete">Delete</button>
          </td>
        `;
        
        usersTable.appendChild(row);
      });

      // Add event listeners to action buttons
      document.querySelectorAll('.action-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
          const userId = this.getAttribute('data-id');
          const action = this.getAttribute('data-action');
          
          try {
            if (action === 'make-admin') {
              await toggleAdminStatus(userId, true);
              alert('User is now an admin');
            } else if (action === 'remove-admin') {
              await toggleAdminStatus(userId, false);
              alert('Admin rights removed');
            } else if (action === 'delete') {
              if (confirm('Are you sure you want to delete this user?')) {
                await deleteUser(userId);
                alert('User deleted');
              }
            }
            
            // Refresh the user list
            const users = await getAllUsers();
            displayUsers(users);
          } catch (error) {
            console.error("Error performing action:", error);
            alert('Error: ' + error.message);
          }
        });
      });

      // Implement pagination
      const paginationDiv = document.getElementById('pagination');
      paginationDiv.innerHTML = '';
      
      // Simplified pagination example
      const pageSize = 10;
      const pageCount = Math.ceil(users.length / pageSize);
      
      if (pageCount > 1) {
        for (let i = 1; i <= pageCount; i++) {
          const btn = document.createElement('button');
          btn.classList.add('pagination-btn');
          if (i === 1) btn.classList.add('active');
          btn.textContent = i;
          
          btn.addEventListener('click', function() {
            // Remove active class from all buttons
            document.querySelectorAll('.pagination-btn').forEach(b => {
              b.classList.remove('active');
            });
            
            // Add active class to clicked button
            this.classList.add('active');
            
            // Calculate start and end index for this page
            const startIndex = (i - 1) * pageSize;
            const endIndex = Math.min(startIndex + pageSize, users.length);
            
            // Display only users for this page
            const pageUsers = users.slice(startIndex, endIndex);
            displayPageUsers(pageUsers);
          });
          
          paginationDiv.appendChild(btn);
        }
      }

      // Function to display users for a specific page
      function displayPageUsers(pageUsers) {
        usersTable.innerHTML = '';
        
        pageUsers.forEach(user => {
          const row = document.createElement('tr');
          
          const adminBadge = user.isAdmin 
            ? '<span class="status-badge status-admin">Admin</span>' 
            : '<span class="status-badge status-user">User</span>';
          
          const adminAction = user.isAdmin
            ? `<button class="action-btn" data-id="${user.id}" data-action="remove-admin">Remove Admin</button>`
            : `<button class="action-btn admin-btn" data-id="${user.id}" data-action="make-admin">Make Admin</button>`;
          
          const createdDate = user.createdAt ? new Date(user.createdAt.toDate()).toLocaleDateString() : 'N/A';
          
          row.innerHTML = `
            <td>${user.name || 'N/A'}</td>
            <td>${user.email || 'N/A'}</td>
            <td>${user.mobile || 'N/A'}</td>
            <td>${createdDate}</td>
            <td>${adminBadge}</td>
            <td>
              ${adminAction}
              <button class="action-btn remove-btn" data-id="${user.id}" data-action="delete">Delete</button>
            </td>
          `;
          
          usersTable.appendChild(row);
        });
        
        // Re-add event listeners for the new buttons
        document.querySelectorAll('.action-btn').forEach(btn => {
          btn.addEventListener('click', async function() {
            const userId = this.getAttribute('data-id');
            const action = this.getAttribute('data-action');
            
            try {
              if (action === 'make-admin') {
                await toggleAdminStatus(userId, true);
                alert('User is now an admin');
              } else if (action === 'remove-admin') {
                await toggleAdminStatus(userId, false);
                alert('Admin rights removed');
              } else if (action === 'delete') {
                if (confirm('Are you sure you want to delete this user?')) {
                  await deleteUser(userId);
                  alert('User deleted');
                }
              }
              
              // Refresh the user list
              const users = await getAllUsers();
              displayUsers(users);
            } catch (error) {
              console.error("Error performing action:", error);
              alert('Error: ' + error.message);
            }
          });
        });
      }
    }
  </script>
</body>
</html>
