<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | VibeZone</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Bungee', cursive;
      background-color: #0d0d0d;
      color: #ffffff;
      overflow-x: hidden;
    }

    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      opacity: 0.5;
    }

    .login-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .login-title {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #ffffff;
      text-shadow: 0 0 10px #00cfff, 0 0 20px #9b30d9;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      color: #444;
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
    }

    .google-btn:hover {
      box-shadow: 0 0 10px rgba(0, 207, 255, 0.5);
    }

    .google-btn img {
      height: 24px;
      margin-right: 10px;
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: none;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #ccc;
      text-align: left;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: #9b30d9;
      box-shadow: 0 0 0 2px rgba(155, 48, 217, 0.2);
    }

    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, #9b30d9, #00cfff);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 207, 255, 0.4);
    }

    .login-footer {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #ccc;
    }

    .login-footer a {
      color: #00cfff;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #ff5252;
      margin-top: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .back-to-home {
      margin-top: 2rem;
      color: #ccc;
      text-decoration: none;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }

    .back-to-home i {
      margin-right: 0.5rem;
    }

    .back-to-home:hover {
      color: white;
    }

    .admin-checkbox {
      display: flex;
      align-items: center;
      margin-top: 1rem;
      text-align: left;
    }

    .admin-checkbox input {
      margin-right: 0.5rem;
    }

    #adminCode {
      display: none;
      margin-top: 1rem;
    }
  </style>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="particles-js"></div>

  <div class="login-container">
    <div class="login-box">
      <h1 class="login-title">Welcome to VibeZone</h1>
      
      <button id="google-login-btn" class="google-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
        Sign in with Google
      </button>
      
      <div id="user-details-form" class="form-group" style="display: none;">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" class="form-control" placeholder="Enter your mobile number">
        
        <div class="admin-checkbox">
          <input type="checkbox" id="isAdmin">
          <label for="isAdmin">I am an admin</label>
        </div>
        
        <div id="adminCode" class="form-group">
          <label for="adminCodeInput">Admin Code</label>
          <input type="password" id="adminCodeInput" class="form-control" placeholder="Enter admin code">
        </div>
        
        <button id="submit-btn" class="submit-btn">Complete Registration</button>
      </div>
      
      <div id="error-message" class="error-message"></div>
      
      <div class="login-footer">
        By signing in, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
      </div>
    </div>
    
    <a href="home.html" class="back-to-home">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script>
    // Initialize particles
    particlesJS("particles-js", {
      particles: {
        number: { value: 60, density: { enable: true, value_area: 800 } },
        color: { value: "#00cfff" },
        shape: { type: "circle" },
        opacity: { value: 0.5 },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#00cfff",
          opacity: 0.4,
          width: 1
        },
        move: { enable: true, speed: 2, out_mode: "bounce" }
      },
      interactivity: {
        events: {
          onhover: { enable: true, mode: "grab" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          grab: { distance: 140, line_linked: { opacity: 1 } },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB_Gx8Reo7Pls-kugk6vCtx58K7F0QnuEU",
      authDomain: "vibez-58fc7.firebaseapp.com",
      projectId: "vibez-58fc7",
      storageBucket: "vibez-58fc7.appspot.com",
      messagingSenderId: "320272207775",
      appId: "1:320272207775:web:1e2240a3f07cbd80abb7aa",
      measurementId: "G-XKWZC5F17V"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Auth and Firestore references
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Get elements from DOM
    const googleBtn = document.getElementById('google-login-btn');
    const userDetailsForm = document.getElementById('user-details-form');
    const mobileInput = document.getElementById('mobile');
    const isAdminCheckbox = document.getElementById('isAdmin');
    const adminCodeDiv = document.getElementById('adminCode');
    const adminCodeInput = document.getElementById('adminCodeInput');
    const submitBtn = document.getElementById('submit-btn');
    const errorMessage = document.getElementById('error-message');

    // Admin code - in a real app, this would be stored securely
    const ADMIN_SECRET_CODE = "VIBEZ2025ADMIN";

    // Toggle admin code field when checkbox is clicked
    isAdminCheckbox.addEventListener('change', function() {
      adminCodeDiv.style.display = this.checked ? 'block' : 'none';
    });

    // Sign in with Google
    googleBtn.addEventListener('click', function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      
      auth.signInWithPopup(provider)
        .then((result) => {
          console.log("Google sign-in successful", result);
          
          // Check if user already exists in database
          checkUserExists(result.user);
        })
        .catch((error) => {
          console.error("Google sign-in error:", error);
          showError("Login failed: " + error.message);
        });
    });

    // Check if user exists in database
    function checkUserExists(user) {
      db.collection("users").doc(user.uid).get()
        .then((doc) => {
          if (doc.exists) {
            // User exists, store user data in local storage for access on home page
            localStorage.setItem('user', JSON.stringify({
              uid: user.uid,
              name: user.displayName,
              email: user.email,
              photoURL: user.photoURL,
              isAdmin: doc.data().isAdmin || false
            }));
            
            // Redirect based on role
            if (doc.data().isAdmin) {
              window.location.href = "admin/dashboard.html";
            } else {
              window.location.href = "home.html";
            }
          } else {
            // New user, continue with form
            userDetailsForm.style.display = 'block';
            googleBtn.style.display = 'none';
          }
        })
        .catch((error) => {
          console.error("Error checking user:", error);
          showError("Error checking user data: " + error.message);
        });
    }

    // Complete registration
    submitBtn.addEventListener('click', function() {
      const user = auth.currentUser;
      const mobile = mobileInput.value.trim();
      const isAdmin = isAdminCheckbox.checked;
      const adminCode = adminCodeInput.value.trim();
      
      if (!mobile) {
        showError("Please enter your mobile number");
        return;
      }
      
      if (isAdmin && adminCode !== ADMIN_SECRET_CODE) {
        showError("Invalid admin code");
        return;
      }
      
      // Check if mobile is already registered
      db.collection("users").where("mobile", "==", mobile).get()
        .then((querySnapshot) => {
          if (!querySnapshot.empty) {
            showError("This mobile number is already registered");
            return;
          }
          
          // Save user data
          return db.collection("users").doc(user.uid).set({
            name: user.displayName,
            email: user.email,
            mobile: mobile,
            isAdmin: isAdmin,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastCheckIn: null // Track last check-in time
          });
        })
        .then(() => {
          console.log("User data saved");
          
          // Store user data in local storage
          localStorage.setItem('user', JSON.stringify({
            uid: user.uid,
            name: user.displayName,
            email: user.email,
            photoURL: user.photoURL,
            isAdmin: isAdmin
          }));
          
          // Redirect based on role
          if (isAdmin) {
            window.location.href = "admin/dashboard.html";
          } else {
            window.location.href = "home.html";
          }
        })
        .catch((error) => {
          console.error("Error saving user data:", error);
          showError("Error saving data: " + error.message);
        });
    });

    // Show error message
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      setTimeout(() => {
        errorMessage.style.display = 'none';
      }, 5000);
    }

    // Check if user is already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Check if user exists in database
        checkUserExists(user);
      }
    });
  </script>
</body>
</html>
